name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [staging, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major as compose.yaml.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: war_weeker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d war_weeker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/war_weeker?sslmode=disable
      DATABASE_DRIVER: pg
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      # Validates that the committed migrations apply cleanly to a fresh
      # database, before anything else touches it.
      - run: pnpm db:migrate

      - run: pnpm test

      # Catches production-compile-only failures that lint, typecheck and
      # dev mode can't see.
      - run: pnpm build
